services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-content_generator}
      POSTGRES_USER: ${DB_USER:-content_generator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-content_generator} -d ${DB_NAME:-content_generator}
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-change-me}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD:-change-me}
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-now}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 5s
      retries: 10

  wechat-content-service:
    build: ./wechat-content-service
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://content_generator:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-content_generator}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      GENERATED_ASSETS_DIR: /app/generated-assets
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-placeholder}
      WECHAT_ENABLED: ${WECHAT_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - generated-assets:/app/generated-assets
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10

  content-scheduler:
    build: ./wechat-content-service
    command:
      - python
      - -m
      - app.scheduler
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://content_generator:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-content_generator}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      GENERATED_ASSETS_DIR: /app/generated-assets
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-placeholder}
      WECHAT_ENABLED: ${WECHAT_ENABLED:-false}
      AUTOMATION_POLL_SECONDS: ${AUTOMATION_POLL_SECONDS:-30}
      AUTOMATION_MAX_RETRIES: ${AUTOMATION_MAX_RETRIES:-3}
    depends_on:
      db:
        condition: service_healthy
      wechat-content-service:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - generated-assets:/app/generated-assets

volumes:
  dbdata:
  redis-data:
  minio-data:
  generated-assets:
