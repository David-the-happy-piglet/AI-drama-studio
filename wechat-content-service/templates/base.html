<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}公众号内容生成器{% endblock %}</title>
  <style>
    :root { color-scheme: light; --green:#2f6f4e; --line:#dce7df; --bg:#f5f7f5; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:#26322b; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { background:#fff; border-bottom:1px solid var(--line); padding:18px 28px; }
    header a { color:var(--green); text-decoration:none; font-weight:700; font-size:20px; }
    main { max-width:1100px; margin:28px auto; padding:0 20px 60px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:0 4px 18px rgba(35,65,46,.04); }
    h1,h2,h3 { color:#244d38; }
    label { display:block; font-weight:600; margin:14px 0 6px; }
    input,select,textarea { width:100%; border:1px solid #bdccc2; border-radius:8px; padding:10px 12px; font:inherit; background:#fff; }
    textarea { min-height:110px; resize:vertical; }
    button,.button { display:inline-block; border:0; border-radius:8px; background:var(--green); color:#fff; padding:10px 16px; text-decoration:none; cursor:pointer; font:inherit; }
    .muted { color:#718078; }
    .tag { display:inline-block; background:#edf5ef; color:#356a4c; border-radius:999px; padding:4px 9px; margin:2px; font-size:13px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:12px 8px; border-bottom:1px solid var(--line); text-align:left; }
    iframe { width:100%; min-height:720px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  </style>
</head>
<body>
  <header><a href="/admin">公众号内容生成器</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
